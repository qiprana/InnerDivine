name: Build continuous Core affirmation video

on:
  push:
    paths:
      - ".github/workflows/build-core-video.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Build continuous Core video and posters
        run: |
          set -e
          mkdir -p videos/posters

          # Use the original full Core recording as one uninterrupted source.
          VOICE_DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 morning-affirmations.m4a)
          TOTAL_DUR=$(python3 -c "print(float('$VOICE_DUR')+6.0)")
          OUT_START=$(python3 -c "print(max(0,float('$TOTAL_DUR')-2.0))")

          # Use a light musical opening from an existing InnerDivine visual,
          # rather than the previous low drone-style synthesized ambience.
          ffmpeg -y -ss 0 -t 4.0 -i A_Channel_for_Grace.mp4             -vn -ac 2 -ar 44100             -af "afade=t=in:st=0:d=0.7,afade=t=out:st=3.0:d=1.0"             /tmp/core_music_seed.wav

          ffmpeg -y -stream_loop -1 -i /tmp/core_music_seed.wav -t "$TOTAL_DUR"             -af "volume=0.10" /tmp/core_music_bed.wav

          # 3-second music-only opening, then the original continuous Core voice,
          # with a gentle 3-second musical tail after the voice.
          ffmpeg -y -i /tmp/core_music_bed.wav -i morning-affirmations.m4a             -filter_complex "[1:a]adelay=3000|3000,volume=1.0[voice];[0:a][voice]amix=inputs=2:duration=first:dropout_transition=2,alimiter=limit=.95[a]"             -map "[a]" -t "$TOTAL_DUR" /tmp/core_continuous_mix.m4a

          # Single visual canvas; this is not assembled from the seven day videos.
          ffmpeg -y -ss 2.5 -i videos/core_01_final.mp4 -frames:v 1 -q:v 2 videos/posters/core_continuous.jpg

          ffmpeg -y -loop 1 -i videos/posters/core_continuous.jpg -i /tmp/core_continuous_mix.m4a             -c:v libx264 -preset medium -crf 20 -tune stillimage -pix_fmt yuv420p -r 30             -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fade=t=in:st=0:d=1.2,fade=t=out:st=$OUT_START:d=2.0"             -c:a aac -b:a 160k -shortest -movflags +faststart             videos/core_continuous_final.mp4

          # Keep daily posters current for Days 1-7.
          for i in 01 02 03 04 05 06 07; do
            ffmpeg -y -ss 2.5 -i "videos/core_${i}_final.mp4" -frames:v 1 -q:v 2 "videos/posters/core_${i}.jpg"
          done
      - name: Commit generated media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/core_continuous_final.mp4 videos/posters/
          if git diff --cached --quiet; then
            echo "No media changes to commit"
          else
            git commit -m "Build continuous Core affirmation video"
            git push
          fi
