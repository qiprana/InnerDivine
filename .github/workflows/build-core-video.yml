name: Build clean captioned continuous Core video

on:
  push:
    paths:
      - ".github/workflows/build-core-video.yml"
      - "scripts/generate_core_ass.py"
      - "assets/core_continuous_background.svg"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: innerdivine-clean-captioned-core-video
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create warm piano background
        run: |
          set -e
          mkdir -p /tmp/piano_notes videos/posters
          make_note() {
            FREQ="$1"; OUT="$2"
            ffmpeg -y -f lavfi -i "aevalsrc=0.18*(sin(2*PI*$FREQ*t)+0.34*sin(4*PI*$FREQ*t)+0.10*sin(6*PI*$FREQ*t))*exp(-3.8*t):s=44100:d=0.78" \
              -af "aecho=0.8:0.30:75:0.10,afade=t=out:st=0.52:d=0.26" -ac 2 "$OUT"
          }
          make_note 261.63 /tmp/piano_notes/c4.wav
          make_note 329.63 /tmp/piano_notes/e4.wav
          make_note 392.00 /tmp/piano_notes/g4.wav
          make_note 523.25 /tmp/piano_notes/c5.wav
          make_note 349.23 /tmp/piano_notes/f4.wav
          make_note 440.00 /tmp/piano_notes/a4.wav
          make_note 293.66 /tmp/piano_notes/d4.wav
          make_note 493.88 /tmp/piano_notes/b4.wav

          cat > /tmp/piano_sequence.txt <<'EOF'
          file '/tmp/piano_notes/c4.wav'
          file '/tmp/piano_notes/e4.wav'
          file '/tmp/piano_notes/g4.wav'
          file '/tmp/piano_notes/c5.wav'
          file '/tmp/piano_notes/f4.wav'
          file '/tmp/piano_notes/a4.wav'
          file '/tmp/piano_notes/c5.wav'
          file '/tmp/piano_notes/a4.wav'
          file '/tmp/piano_notes/g4.wav'
          file '/tmp/piano_notes/b4.wav'
          file '/tmp/piano_notes/d4.wav'
          file '/tmp/piano_notes/g4.wav'
          file '/tmp/piano_notes/c4.wav'
          file '/tmp/piano_notes/e4.wav'
          file '/tmp/piano_notes/g4.wav'
          file '/tmp/piano_notes/c5.wav'
          EOF

          ffmpeg -y -f concat -safe 0 -i /tmp/piano_sequence.txt \
            -c:a pcm_s16le /tmp/warm_morning_piano.wav

      - name: Generate corrected phrase timings
        run: |
          python3 scripts/generate_core_ass.py
          test -s /tmp/core_continuous.ass

      - name: Render text-free background
        run: |
          ffmpeg -y -i assets/core_continuous_background.svg \
            -frames:v 1 -vf "scale=1280:720:flags=lanczos" \
            /tmp/core_background.png
          ffmpeg -y -i /tmp/core_background.png \
            -frames:v 1 -q:v 2 videos/posters/core_continuous_clean_v2.jpg

      - name: Build one clean continuous Core video
        run: |
          set -e
          VOICE_DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 morning-affirmations.m4a)
          TOTAL_DUR=$(python3 -c "print(float('$VOICE_DUR')+6.0)")
          OUT_START=$(python3 -c "print(max(0,float('$TOTAL_DUR')-2.0))")

          ffmpeg -y -stream_loop -1 -i /tmp/warm_morning_piano.wav -t "$TOTAL_DUR" \
            -af "afade=t=in:st=0:d=1.2,afade=t=out:st=$OUT_START:d=2.0" \
            /tmp/piano_full.wav

          # Keep the piano clearly audible while the uninterrupted original voice stays dominant.
          ffmpeg -y -i /tmp/piano_full.wav -i morning-affirmations.m4a \
            -filter_complex "[0:a]volume=0.22[music];[1:a]adelay=3000|3000,volume=1.0[voice];[music][voice]amix=inputs=2:duration=first:dropout_transition=2:normalize=0,alimiter=limit=0.95[a]" \
            -map "[a]" -t "$TOTAL_DUR" /tmp/core_audio_with_piano.m4a

          # Use only the new text-free artwork. No frame from a daily video is reused.
          ffmpeg -y -loop 1 -framerate 30 -i /tmp/core_background.png \
            -i /tmp/core_audio_with_piano.m4a \
            -vf "subtitles=/tmp/core_continuous.ass,fade=t=in:st=0:d=1.0,fade=t=out:st=$OUT_START:d=2.0" \
            -c:v libx264 -preset medium -crf 19 -tune stillimage \
            -pix_fmt yuv420p -r 30 -c:a aac -b:a 192k \
            -t "$TOTAL_DUR" -shortest -movflags +faststart \
            videos/core_continuous_clean_v2.mp4

          ffprobe -v error \
            -show_entries format=duration:stream=index,codec_type,codec_name,width,height \
            -of default=nw=1 videos/core_continuous_clean_v2.mp4

      - name: Create caption QA frames
        run: |
          set -e
          mkdir -p /tmp/core_qa
          ffmpeg -y -ss 4.5   -i videos/core_continuous_clean_v2.mp4 -frames:v 1 -q:v 2 /tmp/core_qa/01_core1.jpg
          ffmpeg -y -ss 9.0   -i videos/core_continuous_clean_v2.mp4 -frames:v 1 -q:v 2 /tmp/core_qa/02_core1.jpg
          ffmpeg -y -ss 27.0  -i videos/core_continuous_clean_v2.mp4 -frames:v 1 -q:v 2 /tmp/core_qa/03_core2.jpg
          ffmpeg -y -ss 46.0  -i videos/core_continuous_clean_v2.mp4 -frames:v 1 -q:v 2 /tmp/core_qa/04_core3.jpg
          ffmpeg -y -ss 66.0  -i videos/core_continuous_clean_v2.mp4 -frames:v 1 -q:v 2 /tmp/core_qa/05_core4.jpg
          ffmpeg -y -ss 91.0  -i videos/core_continuous_clean_v2.mp4 -frames:v 1 -q:v 2 /tmp/core_qa/06_core5.jpg
          ffmpeg -y -ss 114.0 -i videos/core_continuous_clean_v2.mp4 -frames:v 1 -q:v 2 /tmp/core_qa/07_core6.jpg
          ffmpeg -y -ss 127.0 -i videos/core_continuous_clean_v2.mp4 -frames:v 1 -q:v 2 /tmp/core_qa/08_core7.jpg
          ffmpeg -y -ss 145.0 -i videos/core_continuous_clean_v2.mp4 -frames:v 1 -q:v 2 /tmp/core_qa/09_core7.jpg
          ffmpeg -y -ss 151.0 -i videos/core_continuous_clean_v2.mp4 -frames:v 1 -q:v 2 /tmp/core_qa/10_closing.jpg
          ffmpeg -y -pattern_type glob -i '/tmp/core_qa/[0-9][0-9]_*.jpg' \
            -vf "scale=480:-1,tile=2x5:padding=8:margin=8:color=white" \
            -frames:v 1 /tmp/core_qa/contact-sheet.jpg

      - name: Upload QA frames
        uses: actions/upload-artifact@v4
        with:
          name: core-caption-qa-v2
          path: /tmp/core_qa
          retention-days: 3

      - name: Commit clean captioned Core video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/core_continuous_clean_v2.mp4 videos/posters/core_continuous_clean_v2.jpg
          if git diff --cached --quiet; then
            echo "No generated media changes"
          else
            git commit -m "Build clean synchronized continuous Core video"
            git push
          fi
